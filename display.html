<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15倍速デジタル時計 - 表示専用</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #clock {
            font-size: 5em;
        }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>

    <script src="https://js.pusher.com/7.0/pusher.min.js"></script>
    <script>
        // Pusherの設定
        const pusher = new Pusher('YOUR_APP_KEY', {
            cluster: 'YOUR_CLUSTER'
        });

        const channel = pusher.subscribe('clock-channel');

        channel.bind('start', (data) => {
            const startTime = new Date(data.startTime);
            let simulatedTime = data.simulatedTime;
            setInterval(() => {
                simulatedTime += 1000 * 15;
                const currentTime = new Date(startTime.getTime() + simulatedTime);
                document.getElementById("clock").innerText = currentTime.toTimeString().split(" ")[0];
            }, 1000);
        });

        channel.bind('reset', () => {
            document.getElementById("clock").innerText = "00:00:00";
        });
    </script>
</body>
</html>
