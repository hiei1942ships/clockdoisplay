<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15倍速デジタル時計 - 表示専用</title>
    <style>
        body {
            font-family: Arial, sans-serif;
               margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 5vw; /* 画面幅に合わせたフォントサイズ */
      background-color: black;
      color: white;
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>

    <script>
        function updateClock() {
            const startTime = parseInt(localStorage.getItem("startTime")) || 0;
            const simulatedTime = parseInt(localStorage.getItem("simulatedTime")) || 0;

            if (startTime && simulatedTime >= 0) {
                const currentTime = new Date(startTime + simulatedTime);
                document.getElementById("clock").innerText = currentTime.toTimeString().split(" ")[0];
            } else {
                document.getElementById("clock").innerText = "00:00:00";
            }
        }

        setInterval(updateClock, 1000 / 15); // 15倍速で更新
    </script>
</body>
</html>
