<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>15倍速デジタル時計 - コントロール</title>
</head>
<body>
  <div>
    <label for="start-time">開始時間 (HH:MM:SS): </label>
    <input type="text" id="start-time" value="00:00:00">
    <button id="set-button">セット</button>
    <button id="start-button">スタート</button>
    <button id="reset-button">リセット</button>
  </div>

  <script>
    let intervalId;
    let currentTime;

    // 時計の表示を更新する関数
    function updateClock() {
      // 15倍速で時間を進める
      currentTime.setSeconds(currentTime.getSeconds() + 15);

      // 時、分、秒を取得
      const hours = currentTime.getHours();
      const minutes = currentTime.getMinutes();
      const seconds = currentTime.getSeconds();

      // 時、分、秒が1桁の場合は0を追加
      const displayHours = hours.toString().padStart(2, "0");
      const displayMinutes = minutes.toString().padStart(2, "0");
      const displaySeconds = seconds.toString().padStart(2, "0");

      // 時計表示ページに時刻を送信
      window.frames[0].postMessage(`${displayHours}:${displayMinutes}:${displaySeconds}`, "*");
    }

    // セットボタンのクリックイベント
    document.getElementById("set-button").addEventListener("click", function() {
      // ユーザーが指定した開始時間を取得
      const inputTime = document.getElementById("start-time").value;
      const [inputHours, inputMinutes, inputSeconds] = inputTime.split(':').map(Number);

      // 指定した時間からDateオブジェクトを作成
      currentTime = new Date();
      currentTime.setHours(inputHours);
      currentTime.setMinutes(inputMinutes);
      currentTime.setSeconds(inputSeconds);

      // セットされた時間を即座に表示
      updateClock();
    });

    // スタートボタンのクリックイベント
    document.getElementById("start-button").addEventListener("click", function() {
      // 既存のタイマーがある場合はクリア
      clearInterval(intervalId);

      // 1秒毎にupdateClockを実行 (現実時間では1秒だが、時計では15秒が進む)
      intervalId = setInterval(updateClock, 1000);
    });

    // リセットボタンのクリックイベント
    document.getElementById("reset-button").addEventListener("click", function() {
      clearInterval(intervalId);
      window.frames[0].postMessage("00:00:00", "*");
    });
  </script>

  <!-- 時計表示ページをインラインフレームで読み込み -->
  <iframe src="clock.html" style="width: 100%; height: 50px; border: none;"></iframe>
</body>
</html>
