<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15倍速デジタル時計</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #clock {
            font-size: 3em;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>
    <input type="time" id="timeInput" step="1">
    <br>
    <button onclick="startClock()">スタート</button>
    <button onclick="resetClock()">リセット</button>

    <script>
        let startTime;
        let intervalId;

        function updateClock() {
            const now = new Date();
            const elapsed = (now - startTime) * 15; // 15倍速
            const currentTime = new Date(startTime.getTime() + elapsed);
            document.getElementById("clock").innerText = currentTime.toTimeString().split(" ")[0];
        }

        function startClock() {
            const timeInput = document.getElementById("timeInput").value;
            if (timeInput) {
                const [hours, minutes, seconds] = timeInput.split(':').map(Number);
                const now = new Date();
                startTime = new Date(now.setHours(hours, minutes, seconds, 0));
            } else {
                startTime = new Date();
            }
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(updateClock, 1000 / 15);
        }

        function resetClock() {
            clearInterval(intervalId);
            document.getElementById("clock").innerText = "00:00:00";
            document.getElementById("timeInput").value = '';
        }
    </script>
</body>
</html>
