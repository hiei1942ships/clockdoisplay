<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15倍速デジタル時計</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #clock {
            font-size: 3em;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>
    <input type="time" id="timeInput" step="1">
    <br>
    <button onclick="setTime()">セット</button>
    <button onclick="startClock()">スタート</button>
    <button onclick="resetClock()">リセット</button>
    <br>
    <a href="display.html" target="_blank">別ページで時間を表示</a>

    <script src="script.js"></script>
</body>
</html>
