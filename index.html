<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15倍速デジタル時計</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #clock {
                  margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 20vw; /* 画面幅に合わせたフォントサイズ */
      background-color: white;
      color: black;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>
    <input type="time" id="timeInput" step="1">
    <br>
    <button onclick="setTime()">セット</button>
    <button onclick="startClock()">スタート</button>
    <button onclick="resetClock()">リセット</button>
    <br>
    <a href="display.html" target="_blank">別ページで時間を表示</a>

    <script>
        let startTime;
        let intervalId;
        let setHours = 0, setMinutes = 0, setSeconds = 0;
        let simulatedTime = 0; // シミュレートされた時間を管理

        function updateClock() {
            simulatedTime += 1000 * 15; // 15倍速で進める
            const currentTime = new Date(startTime.getTime() + simulatedTime);
            document.getElementById("clock").innerText = currentTime.toTimeString().split(" ")[0];
            localStorage.setItem("startTime", startTime.getTime());
            localStorage.setItem("simulatedTime", simulatedTime);
        }

        function setTime() {
            const timeInput = document.getElementById("timeInput").value;
            if (timeInput) {
                [setHours, setMinutes, setSeconds] = timeInput.split(':').map(Number);
            } else {
                const now = new Date();
                setHours = now.getHours();
                setMinutes = now.getMinutes();
                setSeconds = now.getSeconds();
            }
            document.getElementById("clock").innerText = `${String(setHours).padStart(2, '0')}:${String(setMinutes).padStart(2, '0')}:${String(setSeconds).padStart(2, '0')}`;
        }

        function startClock() {
            if (intervalId) clearInterval(intervalId);

            const now = new Date();
            startTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), setHours, setMinutes, setSeconds, 0);
            simulatedTime = 0; // シミュレートされた時間をリセット

            localStorage.setItem("startTime", startTime.getTime());
            localStorage.setItem("simulatedTime", simulatedTime);

            intervalId = setInterval(updateClock, 1000);
        }

        function resetClock() {
            clearInterval(intervalId);
            document.getElementById("clock").innerText = "00:00:00";
            document.getElementById("timeInput").value = '';
            localStorage.removeItem("startTime");
            localStorage.removeItem("simulatedTime");
            simulatedTime = 0; // シミュレートされた時間をリセット
        }
    </script>
</body>
</html>
