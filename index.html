<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15倍速デジタル時計</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #clock {
            font-size: 3em;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>
    <input type="time" id="timeInput" step="1">
    <br>
    <button onclick="setTime()">セット</button>
    <button onclick="startClock()">スタート</button>
    <button onclick="resetClock()">リセット</button>
    <br>
    <a href="display.html" target="_blank">別ページで時間を表示</a>

    <script>
        let startTime;
        let intervalId;
        let setHours, setMinutes, setSeconds;

        function updateClock() {
            const now = new Date();
            const elapsed = (now - startTime) * 15; // 15倍速
            const currentTime = new Date(startTime.getTime() + elapsed);
            document.getElementById("clock").innerText = currentTime.toTimeString().split(" ")[0];
            localStorage.setItem("currentTime", currentTime.toTimeString().split(" ")[0]);
        }

        function setTime() {
            const timeInput = document.getElementById("timeInput").value;
            if (timeInput) {
                [setHours, setMinutes, setSeconds] = timeInput.split(':').map(Number);
            } else {
                const now = new Date();
                setHours = now.getHours();
                setMinutes = now.getMinutes();
                setSeconds = now.getSeconds();
            }
            document.getElementById("clock").innerText = `${String(setHours).padStart(2, '0')}:${String(setMinutes).padStart(2, '0')}:${String(setSeconds).padStart(2, '0')}`;
        }

        function startClock() {
            if (intervalId) clearInterval(intervalId);
            
            // 正しい現在の日付と設定された時間を使用してstartTimeを初期化
            const now = new Date();
            startTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), setHours, setMinutes, setSeconds, 0);
            
            intervalId = setInterval(updateClock, 1000 / 15);
        }

        function resetClock() {
            clearInterval(intervalId);
            document.getElementById("clock").innerText = "00:00:00";
            document.getElementById("timeInput").value = '';
            localStorage.removeItem("currentTime");
        }
    </script>
</body>
</html>
