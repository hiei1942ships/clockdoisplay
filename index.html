<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15倍速デジタル時計</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #clock {
            font-size: 3em;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>
    <input type="time" id="timeInput" step="1">
    <br>
    <button onclick="setTime()">セット</button>
    <button onclick="startClock()">スタート</button>
    <button onclick="resetClock()">リセット</button>
    <br>
    <a href="display.html" target="_blank">別ページで時間を表示</a>

    <script src="https://js.pusher.com/7.0/pusher.min.js"></script>
    <script>
        // Pusherの設定
        const pusher = new Pusher("036bae6a0be2a39c4d84", {
            cluster: "ap3"
        });

        const channel = pusher.subscribe('clock-channel');

        let setHours = 0, setMinutes = 0, setSeconds = 0;
        let simulatedTime = 0;

        channel.bind('start', (data) => {
            const startTime = new Date(data.startTime);
            simulatedTime = data.simulatedTime;
            setInterval(() => {
                simulatedTime += 1000 * 15;
                const currentTime = new Date(startTime.getTime() + simulatedTime);
                document.getElementById("clock").innerText = currentTime.toTimeString().split(" ")[0];
            }, 1000);
        });

        channel.bind('reset', () => {
            document.getElementById("clock").innerText = "00:00:00";
        });

        function setTime() {
            const timeInput = document.getElementById("timeInput").value;
            if (timeInput) {
                [setHours, setMinutes, setSeconds] = timeInput.split(':').map(Number);
            } else {
                const now = new Date();
                setHours = now.getHours();
                setMinutes = now.getMinutes();
                setSeconds = now.getSeconds();
            }
            document.getElementById("clock").innerText = `${String(setHours).padStart(2, '0')}:${String(setMinutes).padStart(2, '0')}:${String(setSeconds).padStart(2, '0')}`;
        }

        function startClock() {
            const now = new Date();
            const startTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), setHours, setMinutes, setSeconds, 0);
            simulatedTime = 0;

            fetch('https://YOUR_APP_ID.pusherplatform.io/services/APP_ID/events', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: 'start',
                    channels: ['clock-channel'],
                    data: { startTime: startTime.getTime(), simulatedTime }
                })
            });
        }

        function resetClock() {
            fetch('https://YOUR_APP_ID.pusherplatform.io/services/APP_ID/events', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: 'reset',
                    channels: ['clock-channel'],
                    data: {}
                })
            });
        }
    </script>
</body>
</html>
